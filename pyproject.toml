[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-log-analyzer"
version = "0.1.0"
description = "Log file analyzer for llama.cpp / LocalAI performance metrics"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Jan", email = "jan@example.com"},
]

[project.optional-dependencies]
test = ["pytest>=7.0.0"]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
